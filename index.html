<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSUKUYOMI WATCH</title>
  <style>
    /* ═══════════════════════════════════════════
       FONTS
    ═══════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Sawarabi+Mincho&display=swap');

    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #0a0a0a;
      color: #f5e6c8;
      font-family: 'Sawarabi Mincho', 'Noto Serif JP', serif;
    }

    /* ═══════════════════════════════════════════
       BACKGROUND — layered ink-wash + torii
    ═══════════════════════════════════════════ */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ink-wash gradient */
    .bg-ink {
      background:
        radial-gradient(ellipse at 20% 80%, rgba(139,0,0,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(184,134,11,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #111 0%, #0a0a0a 100%);
    }

    /* SVG scene layer */
    .bg-scene { opacity: 0.18; }

    /* floating cherry-blossom petals */
    .petal {
      position: fixed;
      width: 12px; height: 12px;
      background: radial-gradient(ellipse at 30% 30%, #ffb7c5, #c9506b);
      border-radius: 50% 0 50% 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      animation: petalFall linear infinite;
    }

    @keyframes petalFall {
      0%   { opacity: 0; transform: translateY(-20px) rotate(0deg) scale(0.8); }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(105vh) rotate(720deg) scale(0.4); }
    }

    /* ═══════════════════════════════════════════
       MAIN CONTENT
    ═══════════════════════════════════════════ */
    .main-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    /* ── Telescope SVG ── */
    .telescope-container {
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 0 30px rgba(184,134,11,0.3));
      animation: floatTelescope 4s ease-in-out infinite;
    }

    @keyframes floatTelescope {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* ── App Title ── */
    .app-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #ffd700 0%, #ff4500 30%, #ffd700 50%, #ff4500 70%, #ffd700 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerGold 4s ease-in-out infinite;
      text-shadow: none;
      position: relative;
    }

    .app-title::after {
      content: '';
      display: block;
      width: 60%;
      height: 2px;
      margin: 0.8rem auto 0;
      background: linear-gradient(90deg, transparent, #b8860b, #ffd700, #b8860b, transparent);
    }

    @keyframes shimmerGold {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* subtitle kanji */
    .subtitle {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(0.9rem, 2vw, 1.3rem);
      color: #8b0000;
      letter-spacing: 0.5em;
      margin-top: 0.3rem;
      opacity: 0.85;
    }

    .subtitle-jp {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: rgba(255,215,0,0.45);
      letter-spacing: 0.8em;
      margin-top: 0.2rem;
    }

    /* ── Katana divider ── */
    .katana-divider {
      width: min(320px, 80vw);
      margin: 2rem auto;
      opacity: 0.5;
    }

    /* ── Enter Button ── */
    .enter-btn {
      position: relative;
      padding: 1rem 3.5rem;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #ffd700;
      background: transparent;
      border: 2px solid #8b0000;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .enter-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(139,0,0,0.3), rgba(184,134,11,0.15));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .enter-btn:hover::before { opacity: 1; }

    .enter-btn:hover {
      border-color: #ffd700;
      box-shadow:
        0 0 20px rgba(255,215,0,0.15),
        inset 0 0 20px rgba(139,0,0,0.1);
      transform: scale(1.04);
    }

    .enter-btn span { position: relative; z-index: 1; }

    /* corner accents on button */
    .enter-btn .corner {
      position: absolute;
      width: 14px; height: 14px;
      border-color: #ffd700;
      border-style: solid;
      transition: all 0.4s ease;
    }
    .enter-btn .corner.tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
    .enter-btn .corner.tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
    .enter-btn .corner.bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
    .enter-btn .corner.br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

    .enter-btn:hover .corner { width: 20px; height: 20px; }

    /* ═══════════════════════════════════════════
       MODAL OVERLAY
    ═══════════════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .modal-overlay.active {
      opacity: 1; visibility: visible;
    }

    .modal-box {
      position: relative;
      width: min(650px, 92vw);
      background:
        linear-gradient(145deg, rgba(20,10,10,0.97), rgba(10,5,5,0.99));
      border: 1px solid rgba(139,0,0,0.5);
      padding: 2.5rem 2rem 2rem;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.5s ease;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0) scale(1);
    }

    /* decorative corners */
    .modal-box::before, .modal-box::after {
      content: '';
      position: absolute;
      width: 30px; height: 30px;
      border-color: #ffd700;
      border-style: solid;
    }
    .modal-box::before { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .modal-box::after  { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .modal-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.3rem;
      color: #ffd700;
      text-align: center;
      letter-spacing: 0.2em;
      margin-bottom: 1.8rem;
    }

    .modal-title::after {
      content: '';
      display: block;
      width: 50%;
      height: 1px;
      margin: 0.6rem auto 0;
      background: linear-gradient(90deg, transparent, #8b0000, transparent);
    }

    /* close button */
    .modal-close {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none;
      color: #8b0000;
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.3s, transform 0.3s;
      font-family: serif;
      line-height: 1;
    }
    .modal-close:hover { color: #ffd700; transform: rotate(90deg); }

    /* ── Navigation Table ── */
    .nav-table {
      width: 100%;
      border-collapse: collapse;
    }

    .nav-table tr {
      transition: background 0.3s ease;
    }

    .nav-table tr:hover {
      background: rgba(139,0,0,0.15);
    }

    .nav-table td {
      padding: 0;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      text-decoration: none;
      color: #f5e6c8;
      border-bottom: 1px solid rgba(139,0,0,0.2);
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      color: #ffd700;
      padding-left: 1.8rem;
    }

    .nav-link:hover .nav-icon { color: #ffd700; }

    .nav-icon {
      font-size: 1.6rem;
      width: 40px;
      text-align: center;
      color: #8b0000;
      transition: color 0.3s ease;
      flex-shrink: 0;
    }

    .nav-info { flex: 1; }

    .nav-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .nav-desc {
      font-size: 0.78rem;
      color: rgba(245,230,200,0.5);
      margin-top: 0.15rem;
    }

    .nav-arrow {
      color: rgba(139,0,0,0.4);
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .nav-link:hover .nav-arrow {
      color: #ffd700;
      transform: translateX(4px);
    }

    /* ═══════════════════════════════════════════
       DECORATIVE SIDE KANJI
    ═══════════════════════════════════════════ */
    .side-kanji {
      position: fixed;
      font-family: 'Noto Serif JP', serif;
      font-size: 1.4rem;
      writing-mode: vertical-rl;
      color: rgba(139,0,0,0.12);
      letter-spacing: 0.6em;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }
    .side-kanji.left  { left: 1.5rem; top: 50%; transform: translateY(-50%); }
    .side-kanji.right { right: 1.5rem; top: 50%; transform: translateY(-50%); }

    /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
    @media (max-width: 600px) {
      .side-kanji { display: none; }
      .modal-box  { padding: 2rem 1rem 1.5rem; }
      .nav-name   { font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <!-- ╔═══════════════════════════════════════╗
       ║        BACKGROUND LAYERS              ║
       ╚═══════════════════════════════════════╝ -->

  <!-- Ink-wash gradient -->
  <div class="bg-layer bg-ink"></div>

  <!-- SVG scene: torii gate + mountains -->
  <div class="bg-layer bg-scene">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice"
         width="100%" height="100%" style="position:absolute;bottom:0;">
      <!-- distant mountains (ink-wash) -->
      <path d="M0 700 Q200 450 400 580 Q550 420 720 520 Q900 380 1100 500 Q1250 420 1440 550 L1440 900 L0 900Z"
            fill="rgba(40,20,20,0.5)" />
      <path d="M0 750 Q300 550 600 650 Q800 520 1000 620 Q1200 530 1440 630 L1440 900 L0 900Z"
            fill="rgba(30,15,15,0.6)" />

      <!-- torii gate -->
      <g transform="translate(720,520)" fill="none" stroke="#8b0000" stroke-width="4" opacity="0.7">
        <!-- pillars -->
        <line x1="-80" y1="0" x2="-80" y2="200" />
        <line x1="80"  y1="0" x2="80"  y2="200" />
        <!-- top beam (kasagi) -->
        <path d="M-110,-10 Q0,-30 110,-10" stroke-width="6" />
        <!-- lower beam (nuki) -->
        <line x1="-95" y1="20" x2="95" y2="20" stroke-width="4" />
        <!-- small pillar extensions -->
        <line x1="-80" y1="0"  x2="-80" y2="-15" />
        <line x1="80"  y1="0"  x2="80"  y2="-15" />
      </g>

      <!-- cherry blossom branches (left) -->
      <g opacity="0.3">
        <path d="M0 300 Q60 280 120 310 Q160 290 200 320" stroke="#5a2a2a" stroke-width="2" fill="none"/>
        <circle cx="130" cy="300" r="4" fill="#ffb7c5" opacity="0.6"/>
        <circle cx="160" cy="295" r="3" fill="#ffb7c5" opacity="0.5"/>
        <circle cx="180" cy="310" r="5" fill="#ffb7c5" opacity="0.4"/>
        <circle cx="110" cy="308" r="3" fill="#ffb7c5" opacity="0.7"/>
        <circle cx="200" cy="318" r="4" fill="#ffb7c5" opacity="0.3"/>
      </g>

      <!-- cherry blossom branches (right) -->
      <g opacity="0.25">
        <path d="M1440 250 Q1380 240 1320 270 Q1280 250 1240 280" stroke="#5a2a2a" stroke-width="2" fill="none"/>
        <circle cx="1340" cy="260" r="4" fill="#ffb7c5" opacity="0.6"/>
        <circle cx="1300" cy="258" r="3" fill="#ffb7c5" opacity="0.5"/>
        <circle cx="1270" cy="272" r="5" fill="#ffb7c5" opacity="0.4"/>
        <circle cx="1360" cy="268" r="3" fill="#ffb7c5" opacity="0.7"/>
      </g>

      <!-- moon -->
      <circle cx="1150" cy="120" r="55" fill="rgba(255,215,0,0.06)" />
      <circle cx="1150" cy="120" r="50" fill="none" stroke="rgba(255,215,0,0.1)" stroke-width="1" />
    </svg>
  </div>

  <!-- Cherry blossom petals (generated by JS) -->
  <div id="petals-container"></div>

  <!-- Side kanji (decorative) -->
  <div class="side-kanji left">月読の見張り</div>
  <div class="side-kanji right">天体観測所</div>

  <!-- ╔═══════════════════════════════════════╗
       ║         MAIN CONTENT                  ║
       ╚═══════════════════════════════════════╝ -->
  <div class="main-wrapper">

    <!-- Telescope Graphic -->
    <div class="telescope-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
        <defs>
          <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#b8860b" />
            <stop offset="50%"  stop-color="#ffd700" />
            <stop offset="100%" stop-color="#b8860b" />
          </linearGradient>
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#1a1a1a" />
            <stop offset="50%"  stop-color="#2a2a2a" />
            <stop offset="100%" stop-color="#111" />
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- tripod legs -->
        <line x1="100" y1="130" x2="60"  y2="190" stroke="url(#goldShine)" stroke-width="3" stroke-linecap="round"/>
        <line x1="100" y1="130" x2="140" y2="190" stroke="url(#goldShine)" stroke-width="3" stroke-linecap="round"/>
        <line x1="100" y1="130" x2="100" y2="192" stroke="url(#goldShine)" stroke-width="3" stroke-linecap="round"/>

        <!-- tripod junction -->
        <circle cx="100" cy="130" r="5" fill="url(#goldShine)" />

        <!-- telescope body -->
        <g transform="rotate(-35, 100, 110)">
          <!-- main barrel -->
          <rect x="55" y="100" width="110" height="22" rx="11" fill="url(#bodyGrad)"
                stroke="url(#goldShine)" stroke-width="1.5"/>

          <!-- lens hood (front) -->
          <rect x="155" y="96" width="20" height="30" rx="4" fill="url(#bodyGrad)"
                stroke="url(#goldShine)" stroke-width="1.2"/>

          <!-- lens glass -->
          <ellipse cx="176" cy="111" rx="6" ry="12" fill="rgba(100,149,237,0.25)"
                   stroke="rgba(100,149,237,0.5)" stroke-width="1"/>

          <!-- lens flare -->
          <ellipse cx="178" cy="108" rx="2" ry="4" fill="rgba(173,216,230,0.5)" filter="url(#glow)"/>

          <!-- eyepiece -->
          <rect x="35" y="104" width="22" height="14" rx="3" fill="url(#bodyGrad)"
                stroke="url(#goldShine)" stroke-width="1.2"/>

          <!-- gold band decorations -->
          <rect x="90" y="99" width="4" height="24" rx="1" fill="url(#goldShine)" opacity="0.6"/>
          <rect x="120" y="99" width="4" height="24" rx="1" fill="url(#goldShine)" opacity="0.6"/>

          <!-- red accent band (Japanese style) -->
          <rect x="100" y="102" width="14" height="18" rx="2" fill="none"
                stroke="#8b0000" stroke-width="1.5" opacity="0.7"/>

          <!-- small kanji on body -->
          <text x="105" y="115" font-family="'Noto Serif JP', serif" font-size="8"
                fill="#8b0000" opacity="0.6" text-anchor="middle">月</text>
        </g>

        <!-- stars around telescope -->
        <circle cx="30"  cy="30"  r="1.5" fill="#ffd700" opacity="0.6">
          <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="170" cy="25"  r="1"   fill="#ffd700" opacity="0.4">
          <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="25"  cy="70"  r="1.2" fill="#ffd700" opacity="0.5">
          <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="175" cy="65"  r="0.8" fill="#ffd700" opacity="0.3">
          <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="55"  cy="15"  r="1"   fill="#ffd700" opacity="0.45">
          <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="150" cy="45"  r="1.3" fill="#ffd700" opacity="0.35">
          <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </svg>
    </div>

    <!-- App Title -->
    <h1 class="app-title">TSUKUYOMI WATCH</h1>
    <p class="subtitle">月 読 の 番 人</p>
    <p class="subtitle-jp">ツクヨミウォッチ</p>

    <!-- Katana Divider -->
    <div class="katana-divider">
      <svg viewBox="0 0 320 24" xmlns="http://www.w3.org/2000/svg">
        <!-- blade -->
        <line x1="20" y1="12" x2="300" y2="12" stroke="url(#katanaBlade)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- tsuba (guard) -->
        <ellipse cx="240" cy="12" rx="8" ry="6" fill="none" stroke="#8b0000" stroke-width="1.2"/>
        <!-- handle wrapping -->
        <line x1="252" y1="12" x2="300" y2="12" stroke="#3a1a1a" stroke-width="4" stroke-linecap="round"/>
        <line x1="258" y1="10" x2="258" y2="14" stroke="#8b0000" stroke-width="0.8"/>
        <line x1="266" y1="10" x2="266" y2="14" stroke="#8b0000" stroke-width="0.8"/>
        <line x1="274" y1="10" x2="274" y2="14" stroke="#8b0000" stroke-width="0.8"/>
        <line x1="282" y1="10" x2="282" y2="14" stroke="#8b0000" stroke-width="0.8"/>
        <line x1="290" y1="10" x2="290" y2="14" stroke="#8b0000" stroke-width="0.8"/>
        <!-- pommel -->
        <circle cx="298" cy="12" r="3" fill="#8b0000" opacity="0.6"/>
        <defs>
          <linearGradient id="katanaBlade" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="transparent"/>
            <stop offset="20%" stop-color="rgba(192,192,192,0.5)"/>
            <stop offset="80%" stop-color="rgba(255,215,0,0.4)"/>
            <stop offset="100%" stop-color="rgba(184,134,11,0.6)"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Enter Button -->
    <button class="enter-btn" id="enterBtn" aria-label="Open Navigation">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <span>開 く &nbsp;—&nbsp; ENTER</span>
    </button>
  </div>

  <!-- ╔═══════════════════════════════════════╗
       ║           JAVASCRIPT                  ║
       ╚═══════════════════════════════════════╝ -->
  <script>
    // ── Modal logic ──
    const enterBtn    = document.getElementById('enterBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose   = document.getElementById('modalClose');

    enterBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });

    modalClose.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        modalOverlay.classList.remove('active');
      }
    });

    // ── Cherry blossom petal generator ──
    function createPetal() {
      const container = document.getElementById('petals-container');
      const petal = document.createElement('div');
      petal.classList.add('petal');

      const startX  = Math.random() * window.innerWidth;
      const size    = 8 + Math.random() * 10;
      const duration = 8 + Math.random() * 12;
      const delay   = Math.random() * 15;
      const swayAmt = 60 + Math.random() * 100;

      petal.style.left = startX + 'px';
      petal.style.width  = size + 'px';
      petal.style.height = size + 'px';
      petal.style.animationDuration = duration + 's';
      petal.style.animationDelay    = delay + 's';

      // horizontal sway via CSS custom keyframes isn't trivial,
      // so we set a random horizontal drift with inline transform origin
      petal.style.setProperty('--sway', swayAmt + 'px');

      container.appendChild(petal);

      // remove & recreate after animation
      setTimeout(() => {
        petal.remove();
        createPetal();
      }, (duration + delay) * 1000);
    }

    // spawn initial petals
    const petalCount = Math.min(18, Math.floor(window.innerWidth / 80));
    for (let i = 0; i < petalCount; i++) {
      createPetal();
    }
  </script>
</body>
</html>
